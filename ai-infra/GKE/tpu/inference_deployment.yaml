# =============================================================================
# gpu/inference_deployment.yaml — GPU inference with vLLM on GKE
#
# Deploys vLLM as a Deployment + HorizontalPodAutoscaler + Service
# - Scales from 1 to 4 replicas based on GPU utilization
# - Each replica = 1 pod with 1 A100
# - Exposes OpenAI-compatible REST API on port 8000
#
# Apply:  kubectl apply -f gpu/inference_deployment.yaml
# Test:   curl http://$(kubectl get svc mistral-inference-svc -o jsonpath='{.status.loadBalancer.ingress[0].ip}')/v1/models
# =============================================================================

---
# ── Deployment: vLLM inference server ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mistral-gpu-inference
  namespace: default
  labels:
    app: mistral-inference
    hardware: gpu
spec:
  replicas: 1             # start with 1, HPA will scale up
  selector:
    matchLabels:
      app: mistral-inference
      hardware: gpu
  template:
    metadata:
      labels:
        app: mistral-inference
        hardware: gpu
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8000"
        prometheus.io/path:   "/metrics"
    spec:
      nodeSelector:
        pool-type: gpu
        accelerator: a100
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          command: ["python", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - "--model=/gcs/output"           # load fine-tuned model from GCS
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--dtype=bfloat16"
            - "--tensor-parallel-size=1"      # 1 GPU per pod
            - "--max-model-len=8192"
            - "--gpu-memory-utilization=0.90"
            - "--max-num-seqs=256"
            - "--served-model-name=mistral"
            # Metrics endpoint for Prometheus scraping
            - "--enable-prefix-caching"

          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
                  optional: true

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          resources:
            requests:
              cpu: "8"
              memory: "40Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: "80Gi"
              nvidia.com/gpu: "1"

          volumeMounts:
            - name: gcs-fuse-csi
              mountPath: /gcs

          # Readiness: don't send traffic until model is loaded (~2 min)
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 30

          # Liveness: restart if server crashes
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5

      volumes:
        - name: gcs-fuse-csi
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: "$(PROJECT_ID)-mistral-training"
              mountOptions: "implicit-dirs"

      serviceAccountName: training-sa

---
# ── Service: expose inference endpoint ────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mistral-inference-svc
  namespace: default
  annotations:
    # Cloud Monitoring: export service metrics
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: LoadBalancer
  selector:
    app: mistral-inference
    hardware: gpu
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP

---
# ── HorizontalPodAutoscaler: scale on GPU utilization ─────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mistral-gpu-inference-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mistral-gpu-inference
  minReplicas: 1
  maxReplicas: 4
  metrics:
    # Scale on custom metric: GPU utilization via DCGM exporter
    - type: Pods
      pods:
        metric:
          name: DCGM_FI_DEV_GPU_UTIL     # GPU utilization %
        target:
          type: AverageValue
          averageValue: "75"              # scale out when avg util > 75%
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60     # wait 60s before scaling up
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120             # add max 1 replica per 2 min
    scaleDown:
      stabilizationWindowSeconds: 300    # wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300